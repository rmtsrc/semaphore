name: Auto Merge Latest Release

on:
  schedule:
    - cron: '06 0 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  merge-latest-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up upstream remote
        run: |
          git remote add upstream https://github.com/ansible-semaphore/semaphore.git || true

      - name: Get latest release
        id: latest_release
        run: |
          latest_commit=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ansible-semaphore/semaphore/releases/latest)

          latest_release_tag_name=$(echo "$latest_commit" | jq -r '.tag_name')
          echo "tag_name=$latest_release_tag_name" >> $GITHUB_OUTPUT
          echo "merge_branch=merged-$latest_release_tag_name" >> $GITHUB_OUTPUT

      - name: Update develop branch
        run: |
          git fetch upstream
          git fetch origin
          git checkout -B develop origin/develop
          git pull --rebase upstream develop
          git push --force origin develop

      - name: Check if merge branch exists
        id: check_branch
        run: |
          if git rev-parse --verify origin/${{ steps.latest_release.outputs.merge_branch }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and merge release branch
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          git fetch upstream --tags --force
          git checkout ${{ steps.latest_release.outputs.tag_name }}
          git checkout -b ${{ steps.latest_release.outputs.merge_branch }}
          git diff origin/develop...origin/prefers-color-scheme | git apply --3way
          git commit -am "Merge prefers-color-scheme into ${{ steps.latest_release.outputs.tag_name }}"
          git diff origin/develop...origin/use-locale-datetime | git apply --3way
          git commit -am "Merge use-locale-datetime into ${{ steps.latest_release.outputs.tag_name }}"
          git push origin ${{ steps.latest_release.outputs.merge_branch }}

      - name: Set up Docker Buildx
        if: steps.check_branch.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_branch.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          docker buildx build --no-cache \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            -f deployment/docker/server/Dockerfile \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ steps.latest_release.outputs.tag_name }} \
            --push .
